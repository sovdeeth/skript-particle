import org.apache.tools.ant.filters.ReplaceTokens

buildscript {
    // The skript-test plugin is only published to mavenLocal for now, so it is optional:
    // without it (e.g. on CI) the project still builds and runs its JUnit tests, just not the Skript tests.
    def skriptTestMarker = new File(System.getProperty('user.home'),
            '.m2/repository/skript-test/skript-test.gradle.plugin/1.0.1')
    if (skriptTestMarker.isDirectory()) {
        repositories { mavenLocal() }
        dependencies { classpath 'skript-test:skript-test.gradle.plugin:1.0.1' }
    }
}

plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.5'
    id("io.papermc.paperweight.userdev") version "2.0.0-beta.24"
}

if (buildscript.configurations.classpath.dependencies.any { it.group == 'skript-test' }) {
    apply plugin: 'skript-test'
    skriptTest {
        dependsOn build
        testScriptDirectory = file("src/test/scripts")
        extraPluginsDirectory = layout.buildDirectory.dir("libs")
        skriptRepoRef = "2.17.1"
        runVanillaTests = false
    }
} else {
    logger.lifecycle("skript-test plugin not found in mavenLocal; the Skript tests (skriptTest) are unavailable")
}

group 'com.sovdee'

configurations.configureEach {
    resolutionStrategy.cacheChangingModulesFor 1, 'minutes'
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        url 'https://repo.skriptlang.org/releases'
    }
}

dependencies {
    implementation project(':shapes-lib')
    paperweight.paperDevBundle("26.3.build.+")
    compileOnly("com.github.SkriptLang:Skript:2.17.1")
    compileOnly "org.joml:joml:${jomlVersion}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.0'
    testImplementation("com.github.SkriptLang:Skript:2.17.1")
    testImplementation "org.joml:joml:${jomlVersion}"
}

tasks.named('test') {
    useJUnitPlatform()
}

processResources {
    filter ReplaceTokens, tokens: ["version": project.property("version")]
}

javadoc {
    source = sourceSets.main.allJava
    classpath = configurations.compileClasspath
    options.encoding = 'UTF-8'
}

java {
    toolchain.languageVersion.set(JavaLanguageVersion.of(25))
}

shadowJar {
    archiveClassifier.set('')
    configurations = [project.configurations.runtimeClasspath]
    exclude 'org/joml/**'
    exclude 'META-INF/maven/org.joml/**'
}

tasks.named('jar') {
    enabled = false
}

tasks.named('build') {
    dependsOn shadowJar
}

tasks.register('copyJar', Copy) {
    dependsOn shadowJar
    from shadowJar.archiveFile
    into "e:/PaperServer/plugins"
}
