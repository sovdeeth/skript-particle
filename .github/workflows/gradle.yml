# Builds both modules and runs their JUnit tests.
# The Skript tests (skriptTest) are not run here: the skript-test Gradle plugin is only published to mavenLocal for now.

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    # 'build' runs the JUnit tests of shapes-lib and skript-particle before packaging the plugin
    - name: Build and test with Gradle
      run: ./gradlew build
    - name: Upload test reports
      uses: actions/upload-artifact@v6
      if: failure()
      with:
        name: test-reports
        path: |
          */build/reports/tests/test/
          */build/test-results/test/*.xml
    - name: Upload Nightly Build
      uses: actions/upload-artifact@v6
      if: success()
      with:
        name: skript-particle-nightly
        path: skript-particle/build/libs/*.jar
